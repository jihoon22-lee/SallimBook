[project]
name = "sallimbook-api"
version = "0.1.0"
description = "SallimBook modular API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
  "webauthn==3.0.1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sallimbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["database: requires an isolated PostgreSQL *_test database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
