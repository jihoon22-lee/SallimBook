# Private, RAM-only stream spool. Runtime must mount this directory as tmpfs,
# disable container swap, and provide a read-only root filesystem.
Foreground yes
LocalSocket /run/sallimbook/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 7
TemporaryDirectory /run/sallimbook/spool
ForceToDisk no
LeaveTemporaryFiles no
GenerateMetadataJson no
LogFile /dev/null
LogSyslog no
LogVerbose no
LogClean no
ExtendedDetectionInfo no
Debug no
StreamMaxLength 20M
MaxScanSize 64M
MaxFileSize 20M
MaxRecursion 16
MaxFiles 1000
MaxScanTime 10000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
HeuristicAlerts yes
DisableCache yes
MaxThreads 1
MaxQueue 2
ReadTimeout 15
CommandReadTimeout 5
SendBufTimeout 500
ConcurrentDatabaseReload no
ExitOnOOM yes
