// Explicit -I input for the signed release tool; ordinary debug builds are unaffected.
gradle.afterProject { project, state ->
    if (project.path == ':app' && project.plugins.hasPlugin('com.android.application')) {
        def code = project.providers.gradleProperty('sallimbookReleaseVersionCode').get()
        def name = project.providers.gradleProperty('sallimbookReleaseVersionName').get()
        if (!(code ==~ /[1-9][0-9]*/) || !(name ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
            throw new GradleException('Explicit release version required')
        }
        project.android.defaultConfig.versionCode = Integer.parseInt(code)
        project.android.defaultConfig.versionName = name
        project.android.buildTypes.release.debuggable = false
    }
}
