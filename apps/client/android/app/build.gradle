apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

kotlin { jvmToolchain(21) }
dependencyLocking { lockAllConfigurations() }

android {
    namespace = "io.github.jihoon22lee.sallimbook"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion "36.0.0"
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "io.github.jihoon22lee.sallimbook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "SALLIMBOOK_API_ORIGIN", groovy.json.JsonOutput.toJson(
            providers.gradleProperty("sallimbookApiOrigin").getOrElse("")
        )
        buildConfigField "String", "SALLIMBOOK_PASSKEY_RP_ID", groovy.json.JsonOutput.toJson(
            providers.gradleProperty("sallimbookPasskeyRpId").getOrElse("")
        )
        buildConfigField "String", "SALLIMBOOK_PASSKEY_CERT_SHA256", groovy.json.JsonOutput.toJson(
            providers.gradleProperty("sallimbookPasskeyCertSha256").getOrElse("")
        )
        def passkeyRp = providers.gradleProperty("sallimbookPasskeyRpId").getOrElse("")
        def passkeyStatements = passkeyRp ==~ /[a-z0-9.-]+/ ?
            [[include: "https://${passkeyRp}/.well-known/assetlinks.json"]] : []
        resValue "string", "asset_statements", groovy.json.JsonOutput.toJson(passkeyStatements).replace('"', '\\"')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Keep raw device diagnostics in a fresh private directory owned by the harness.
    def cloudResults = providers.gradleProperty("sallimbookCloudResults").orNull
    if (cloudResults != null) {
        testOptions.resultsDir = "${cloudResults}/results"
        testOptions.reportDir = "${cloudResults}/reports"
    }
    // Opt-in disposable cloud fixture. The directory is generated outside the
    // checkout and contains only a debug manifest and a public test CA.
    // Release never reads this source set; ordinary debug builds are unchanged.
    def cloudFixture = providers.gradleProperty("sallimbookCloudFixture").orNull
    if (cloudFixture != null) {
        sourceSets.debug.manifest.srcFile("${cloudFixture}/AndroidManifest.xml")
        sourceSets.debug.res.srcDir("${cloudFixture}/res")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    debugImplementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    implementation "com.google.crypto.tink:tink-android:1.24.0"
    implementation "com.google.code.gson:gson:2.13.2"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('validateBundledRuntimeConfig') {
    doLast {
        def configFile = file('src/main/assets/capacitor.config.json')
        if (!configFile.isFile()) {
            throw new GradleException('Run pnpm android:sync before building.')
        }
        def config = new groovy.json.JsonSlurper().parse(configFile)
        if (config.server?.url != null) {
            throw new GradleException('Remote WebView URLs are forbidden; bundle local web assets.')
        }
        def allowNavigation = config.server?.allowNavigation
        if (allowNavigation != null && (!(allowNavigation instanceof List) || !allowNavigation.isEmpty())) {
            throw new GradleException('Remote WebView navigation is forbidden; server.allowNavigation must be absent or empty.')
        }
        if (config.server?.cleartext == true || config.android?.allowMixedContent == true) {
            throw new GradleException('Cleartext and mixed content are forbidden.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('validateBundledRuntimeConfig') }
